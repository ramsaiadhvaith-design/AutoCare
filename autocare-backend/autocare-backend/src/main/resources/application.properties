spring.application.name=autocare-backend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Local MySQL defaults; override credentials with environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autocare_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Render supplies PORT; local development defaults to 8080.
server.port=${PORT:8080}
